# The board's default SPI (MOSI PB23 PAD3, MISO PB22 PAD2, SCK PA17 PAD1, all
# PMUX C) on SERCOM1, replacing the descriptor's Feather UART on that SERCOM.
- id: "sercom1"
  type: "sam_sercom_spi"
  base_address: 0x40003400
  size: "256B"
  irq: 50
  clock:
    controller: "mclk"
    reg: "APBAMASK"
    bit: 13
  config:
    gclk_id: 8
    sck_port_base: 0x41008000
    sck_bit: 17
    mosi_port_base: 0x41008080
    mosi_bit: 23
    miso_port_base: 0x41008080
    miso_bit: 22
    dipo: 2
    pad_mux: 2
    dopo: 2
    dma_tx_trigger: 7
    dma_rx_trigger: 6
