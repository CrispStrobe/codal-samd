name: Simulation IRQ mask delivery ARM build
on:
  push:
    paths:
      - 'simulation/arm/irq-mask-probe.cpp'
      - 'simulation/arm/irq-startup.S'
      - 'simulation/arm/control.ld'
      - 'simulation/include/InterruptMask.h'
      - '.github/workflows/simulation-irq-mask.yml'
  pull_request:
    paths:
      - 'simulation/arm/irq-mask-probe.cpp'
      - 'simulation/arm/irq-startup.S'
      - 'simulation/arm/control.ld'
      - 'simulation/include/InterruptMask.h'
      - '.github/workflows/simulation-irq-mask.yml'
permissions:
  contents: read
jobs:
  arm-irq-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler and header packages only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-dev
          arm-none-eabi-g++ --version
      - name: Compile and link owned IRQ control (not execute)
        run: |
          arm-none-eabi-g++ -mcpu=cortex-m4 -mthumb -std=c++11 -O0 \
            -ffreestanding -fno-exceptions -fno-rtti -fno-unwind-tables \
            -fno-asynchronous-unwind-tables -Wall -Wextra -Werror -pedantic \
            -I simulation/include -c simulation/arm/irq-mask-probe.cpp -o "$RUNNER_TEMP/probe.o"
          arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb \
            -c simulation/arm/irq-startup.S -o "$RUNNER_TEMP/startup.o"
          arm-none-eabi-g++ -mcpu=cortex-m4 -mthumb -nostdlib -nostartfiles \
            -Wl,--no-undefined,-Map="$RUNNER_TEMP/control.map" \
            -T simulation/arm/control.ld "$RUNNER_TEMP/startup.o" "$RUNNER_TEMP/probe.o" \
            -o "$RUNNER_TEMP/control.elf"
          test -z "$(arm-none-eabi-nm -u "$RUNNER_TEMP/control.elf")"
          arm-none-eabi-size "$RUNNER_TEMP/control.elf"
          arm-none-eabi-nm "$RUNNER_TEMP/control.elf"
          arm-none-eabi-objdump -h -d "$RUNNER_TEMP/control.elf"
          sha256sum simulation/arm/irq-mask-probe.cpp simulation/arm/irq-startup.S \
            simulation/arm/control.ld simulation/include/InterruptMask.h \
            "$RUNNER_TEMP/control.elf" "$RUNNER_TEMP/control.map"
