name: Prospective actual Timer caller ARM build
on:
  pull_request:
    paths: ['timer-caller/**', '.github/workflows/simulation-timer-caller.yml']
permissions:
  contents: read
jobs:
  arm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-timer-core
          persist-credentials: false
      - name: Install compiler only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          arm-none-eabi-g++ --version
          dpkg-query -W gcc-arm-none-eabi
      - name: Compile actual pinned Timer and authored test adapters without execution
        run: bash timer-caller/build.sh owned-timer-core "$RUNNER_TEMP/timer-caller"
      - name: Preserve prospective build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prospective-real-timer-caller-build
          path: ${{ runner.temp }}/timer-caller/
