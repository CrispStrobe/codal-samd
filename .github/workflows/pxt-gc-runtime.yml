name: Real PXT GC and CODAL services link
on:
  pull_request:
    paths:
      - 'pxt-gc-runtime/**'
      - 'pxt-native-allocation/**'
      - 'runtime-services/**'
      - 'tools/pxt-storage/**'
      - 'profiles/pxt-framework-sources.json'
      - '.github/workflows/pxt-gc-runtime.yml'
permissions:
  contents: read
jobs:
  pxt-gc-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-gc-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt-common-packages
          ref: 31abf23d118f35010fb75122e60a1eb2b6dffe9f
          path: owned-gc-framework
          sparse-checkout: libs
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt
          ref: c40f412dc5bebb915a5891cd62fe956e198fb194
          path: owned-gc-generator
          sparse-checkout: pxtlib
          persist-credentials: false
      - name: Pure adaptation and startup controls (not guest qualification)
        run: |
          python3 -B -m unittest discover -s pxt-gc-runtime -p 'test_*.py' -v
          python3 -B -m unittest discover -s pxt-native-allocation -p 'test_*.py' -v
      - name: Install hosted compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Link actual GC, objects, roots, configuration and CODAL services
        run: python3 -B pxt-gc-runtime/build_gc.py owned-gc-core owned-gc-framework owned-gc-generator gc-link-evidence
      - name: Preserve authored guest image and source-bound link evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxt-gc-link-evidence
          path: |
            gc-link-evidence/**
            !gc-link-evidence/**/*.o
          if-no-files-found: warn
          retention-days: 14
