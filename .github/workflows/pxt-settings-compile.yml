name: Real PXT settings and base classes compile-only
on:
  pull_request:
    paths:
      - 'pxt-settings-compile/**'
      - 'tools/pxt-storage/**'
      - 'profiles/pxt-framework-sources.json'
      - 'consumer-build/build.py'
      - 'runtime-services/platform_includes.h'
      - 'runtime-services/reviewed-toolchain/**'
      - '.github/workflows/pxt-settings-compile.yml'
permissions:
  contents: read
jobs:
  pxt-settings-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-settings-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt-common-packages
          ref: 31abf23d118f35010fb75122e60a1eb2b6dffe9f
          path: owned-settings-framework
          sparse-checkout: libs
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt
          ref: c40f412dc5bebb915a5891cd62fe956e198fb194
          path: owned-settings-generator
          sparse-checkout: pxtlib
          persist-credentials: false
      - name: Include adaptation, real-type preservation and admission controls
        run: python3 -B -m unittest discover -s pxt-settings-compile -p 'test_*.py' -v
      - name: Install hosted ARM compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Compile real settings, complete base types and selected ABI assertions
        run: python3 -B pxt-settings-compile/compile_settings.py owned-settings-core owned-settings-framework owned-settings-generator settings-compile-evidence
      - name: Preserve original/adapted inputs, ABI probe, flags, diagnostics and notices
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxt-settings-compile-evidence
          path: |
            settings-compile-evidence/**
            !settings-compile-evidence/**/*.o
          if-no-files-found: warn
          retention-days: 14
