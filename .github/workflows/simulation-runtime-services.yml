name: Prospective real CODAL services build
on:
  pull_request:
    paths: ['runtime-services/**', '.github/workflows/simulation-runtime-services.yml']
permissions:
  contents: read
jobs:
  services-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-services-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-refusal-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-clock-irq-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-clock-stop-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-long-gap-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-heap-alignment-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-public-heap-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-public-heap-oom-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-spi-services-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-spi-cancel-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-spi-mclk-timeout-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-spi-gclk-timeout-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-spi-error-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-spi-stale-core
          persist-credentials: false
      - name: Install compiler only
        # Every source-bound caller has a separate clean core checkout.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          arm-none-eabi-g++ --version
          dpkg-query -W gcc-arm-none-eabi
      - name: Compile actual services and selected adapters without execution
        run: |
          bash runtime-services/build.sh owned-services-core "$RUNNER_TEMP/runtime-services/positive" 0
          bash runtime-services/build.sh owned-refusal-core "$RUNNER_TEMP/runtime-services/closed-switch" 1
          bash runtime-services/build.sh owned-clock-irq-core "$RUNNER_TEMP/runtime-services/clock-irq-disable" 2
          bash runtime-services/build.sh owned-clock-stop-core "$RUNNER_TEMP/runtime-services/clock-disable" 3
          bash runtime-services/build.sh owned-long-gap-core "$RUNNER_TEMP/runtime-services/long-gap" 4
          bash runtime-services/build.sh owned-heap-alignment-core "$RUNNER_TEMP/runtime-services/heap-alignment" 5
          bash runtime-services/build.sh owned-public-heap-core "$RUNNER_TEMP/runtime-services/public-heap" 6
          bash runtime-services/build.sh owned-public-heap-oom-core "$RUNNER_TEMP/runtime-services/public-heap-oom" 7
          bash runtime-services/build.sh owned-spi-services-core "$RUNNER_TEMP/runtime-services/spi-services" 8
          bash runtime-services/build.sh owned-spi-cancel-core "$RUNNER_TEMP/runtime-services/spi-cancel" 9
          bash runtime-services/build.sh owned-spi-mclk-timeout-core "$RUNNER_TEMP/runtime-services/spi-mclk-timeout" 10
          bash runtime-services/build.sh owned-spi-gclk-timeout-core "$RUNNER_TEMP/runtime-services/spi-gclk-timeout" 11
          bash runtime-services/build.sh owned-spi-error-core "$RUNNER_TEMP/runtime-services/spi-error" 12
          bash runtime-services/build.sh owned-spi-stale-core "$RUNNER_TEMP/runtime-services/spi-stale" 13
      - name: Hosted runtime-state controls, not ARM guest execution
        run: python3 -B runtime-services/state-controls.py
      - name: Preserve prospective source/build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prospective-real-codal-services-build
          path: ${{ runner.temp }}/runtime-services/
