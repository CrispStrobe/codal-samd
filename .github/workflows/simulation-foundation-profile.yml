name: Simulation foundation source inventory
on:
  push:
    paths: ['profiles/armv7em-foundations.json', 'tools/foundation-profile/**', '.github/workflows/simulation-foundation-profile.yml']
  pull_request:
    paths: ['profiles/armv7em-foundations.json', 'tools/foundation-profile/**', '.github/workflows/simulation-foundation-profile.yml']
permissions:
  contents: read
jobs:
  source-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require closed-inventory refusal controls
        run: python3 tools/foundation-profile/test_profile.py
      - name: Bind selected bytes to immutable foundation source
        run: python3 tools/foundation-profile/check_profile.py
      - name: Unsupported native runtime request must refuse
        run: |
          set +e
          python3 tools/foundation-profile/check_profile.py --require native-arcade
          status=$?
          test "$status" -eq 2
