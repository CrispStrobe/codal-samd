name: Allocated DMA cancellation and error callers
on:
  pull_request:
    paths:
      - 'pxt-gc-runtime/**'
      - 'pxt-native-allocation/**'
      - 'runtime-services/**'
      - 'tools/pxt-storage/**'
      - 'profiles/pxt-framework-sources.json'
      - '.github/workflows/pxt-allocated-dma-terminals.yml'
permissions:
  contents: read
jobs:
  allocated-dma-terminal:
    strategy:
      fail-fast: false
      matrix:
        case: [allocated-dma-cancel, allocated-dma-error]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-gc-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt-common-packages
          ref: 31abf23d118f35010fb75122e60a1eb2b6dffe9f
          path: owned-gc-framework
          sparse-checkout: libs
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt
          ref: c40f412dc5bebb915a5891cd62fe956e198fb194
          path: owned-gc-generator
          sparse-checkout: pxtlib
          persist-credentials: false
      - name: Pure adaptation and startup controls (not guest qualification)
        run: |
          python3 -B -m unittest discover -s pxt-gc-runtime -p 'test_*.py' -v
          python3 -B -m unittest discover -s pxt-native-allocation -p 'test_*.py' -v
      - name: Install hosted compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Link selected actual allocator and SPI inputs (NOT guest qualification)
        run: python3 -B pxt-gc-runtime/build_gc.py owned-gc-core owned-gc-framework owned-gc-generator gc-link-evidence --case ${{ matrix.case }}
      - name: Selected memset host boundary controls (not ARM qualification)
        run: |
          set -o pipefail
          python3 -B pxt-gc-runtime/check_memset.py | tee gc-link-evidence/memset-boundaries.log
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CrispStrobe/labwired-core
          ref: 79071f69cd6035a820cbdad93da7343d7d501e4d
          path: owned-gc-engine
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owned-gc-engine
      - name: Bind owned allocated-buffer observer to unchanged engine
        run: |
          test "$(git -C owned-gc-engine rev-parse HEAD)" = 79071f69cd6035a820cbdad93da7343d7d501e4d
          test -z "$(git -C owned-gc-engine status --porcelain --untracked-files=no)"
          test ! -e owned-gc-engine/crates/core/tests/bw_pxt_allocated_dma_terminal.rs
          install -m 0644 pxt-gc-runtime/guest-allocated-dma-terminal.rs owned-gc-engine/crates/core/tests/bw_pxt_allocated_dma_terminal.rs
          cmp pxt-gc-runtime/guest-allocated-dma-terminal.rs owned-gc-engine/crates/core/tests/bw_pxt_allocated_dma_terminal.rs
          sha256sum pxt-gc-runtime/guest-allocated-dma-terminal.rs > gc-link-evidence/guest-fixture-sha256.txt
          git rev-parse HEAD > gc-link-evidence/guest-runtime-source.txt
          git -C owned-gc-engine rev-parse HEAD > gc-link-evidence/guest-engine-source.txt
      - name: Observe actual allocated-buffer partial terminal in both profiles
        env:
          BW_GC_ENGINE_SOURCE: 79071f69cd6035a820cbdad93da7343d7d501e4d
        run: |
          set -o pipefail
          export BW_GC_FIXTURE_DIR="$GITHUB_WORKSPACE/gc-link-evidence"
          BW_GC_RUNTIME_SOURCE="$(git rev-parse HEAD)"
          export BW_GC_RUNTIME_SOURCE
          cd owned-gc-engine
          cargo test --release --locked -p labwired-core --test bw_pxt_allocated_dma_terminal -- --nocapture 2>&1 | tee ../gc-link-evidence/guest-controls.log
          cargo test --release --locked -p labwired-core --test bw_pxt_allocated_dma_terminal -- --ignored --nocapture 2>&1 | tee ../gc-link-evidence/guest-default.log
          cargo test --release --locked -p labwired-core --features event-scheduler --test bw_pxt_allocated_dma_terminal -- --ignored --nocapture 2>&1 | tee ../gc-link-evidence/guest-event-scheduler.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Detect four actual partial-terminal source mutants in both profiles
        run: |
          set -o pipefail
          python3 -B pxt-gc-runtime/check_terminal_dma_mutants.py | tee gc-dma-terminal-mutants-summary.log
      - name: Preserve initial source-bound link packet, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.case }}-preparation
          path: |
            gc-link-evidence/**
            !gc-link-evidence/**/*.o
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve partial-terminal mutation originals including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.case }}-mutations
          path: |
            gc-dma-terminal-mutants/**
            !gc-dma-terminal-mutants/**/*.o
            gc-dma-terminal-mutants-summary.log
          if-no-files-found: warn
          retention-days: 14
