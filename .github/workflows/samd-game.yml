name: Source-bound active native and WASM SAMD game
on:
  pull_request:
    paths: ['samd-game/**', '.github/workflows/samd-game.yml']
permissions:
  contents: read
jobs:
  active-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ENGINE: c122b91f2c9f67cea6b9ddde14a6c40fc4026ce8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-fb-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal
          ref: 7cf09a3a37c8aca6e100b7265c81e6cdf6129dd2
          path: owned-fb-generator
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-itsybitsy-m4
          ref: 6ecd80ccf1abcc126d06653f178ca03a4d1c6421
          path: owned-fb-board
          persist-credentials: false
      - name: Install hosted ARM compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Admitted Arcade 4.2.1 target and PXT 13.2.1 worker payloads
        run: |
          set -euo pipefail
          mkdir -p fb-inputs/npm
          cd fb-inputs/npm
          curl -sSfL -o arcade.tgz https://registry.npmjs.org/pxt-arcade/-/pxt-arcade-4.2.1.tgz
          curl -sSfL -o core.tgz https://registry.npmjs.org/pxt-core/-/pxt-core-13.2.1.tgz
          tar xzf arcade.tgz package/built/target.json
          mv package/built/target.json target.json
          tar xzf core.tgz package/built/web/pxtworker.js
          mv package/built/web/pxtworker.js pxtworker.js
          echo "6f35aadf1456436b3318d2f2339cc3d1add6e6c3b0bf8566f86d7f7bb4f7722e  target.json" | sha256sum -c
          echo "1d9e73fd4bc0c0939b938395537ff1934b398654f9026f88e9293c32ea5acb0e  pxtworker.js" | sha256sum -c
          sha256sum arcade.tgz core.tgz
      - name: Reproduce the admitted native build requests offline
        run: |
          set -euo pipefail
          node tools/pxt-native-request/request.mjs fb-inputs/npm/target.json fb-inputs/npm/pxtworker.js samd51adafruit fb-inputs/request.json
          echo "19efcdc73769fdfdeb51aa215c528bebad59782cbc538f72f4a194326f1f42b1  fb-inputs/request.json" | sha256sum -c
      - name: Generate device headers from the Apache-2.0 ATDF
        run: |
          set -euo pipefail
          mkdir -p fb-inputs/dfp
          curl -sSfL -o fb-inputs/dfp/pack.atpack https://packs.download.microchip.com/Microchip.SAMD51_DFP.3.9.276.atpack
          echo "6f4e530bb8ce3d7a86b7bfafb072110f1e6eb4aa53e554c71f3db6a9720c039f  fb-inputs/dfp/pack.atpack" | sha256sum -c
          unzip -q -o fb-inputs/dfp/pack.atpack LICENSE.txt samd51a/atdf/ATSAMD51J19A.atdf -d fb-inputs/dfp
          cmp fb-inputs/dfp/LICENSE.txt tools/samd51-device-header/notices/microchip-samd51-dfp-3.9.276-LICENSE.txt
          python3 -B tools/samd51-device-header/generate.py fb-inputs/dfp/samd51a/atdf/ATSAMD51J19A.atdf fb-inputs/device
          python3 -B tools/samd51-device-header/test_generate.py fb-inputs/dfp/samd51a/atdf/ATSAMD51J19A.atdf fb-inputs/device
      - name: Compile the selected owned runtime and actual game
        run: |
          set -euo pipefail
          python3 -B no-asf-board/fullboard/build.py --colour-profile rgb444-lut --core owned-fb-core --generator owned-fb-generator --board owned-fb-board --request fb-inputs/request.json --device fb-inputs/device --out game-evidence/base
          node tools/pxt-native-request/compile.mjs fb-inputs/npm/target.json fb-inputs/npm/pxtworker.js samd51adafruit game-evidence/base/no-asf-board.hex samd-game/game.ts game-evidence/program
          python3 -B no-asf-board/native/boot.py game-evidence/program/binary.uf2 game-evidence/image.bin
          python3 -B samd-game/package.py game-evidence/image.bin game-evidence/package game-evidence/base/no-asf-board.elf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CrispStrobe/labwired-core
          ref: ${{ env.ENGINE }}
          path: owned-game-engine
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owned-game-engine
          cache-on-failure: true
          cache-all-crates: true
          key: samd-native-wasm-game
      - name: Bind actual engine, configuration and native receiver
        run: |
          set -euo pipefail
          test "$(git -C owned-game-engine rev-parse HEAD)" = "$ENGINE"
          test -z "$(git -C owned-game-engine status --porcelain --untracked-files=no)"
          test ! -e owned-game-engine/crates/core/tests/bw_game.rs
          install -m 0644 samd-game/native.rs owned-game-engine/crates/core/tests/bw_game.rs
          mkdir game-evidence/config
          cp owned-game-engine/configs/chips/samd51-no-asf-simulation.yaml game-evidence/config/
          cp owned-game-engine/configs/systems/samd51-no-asf-simulation.yaml game-evidence/config/system.yaml
          cp owned-game-engine/configs/devices/st7735r-memory-simulation.yaml game-evidence/config/display.yaml
          sha256sum samd-game/* game-evidence/config/* > game-evidence/source-files.sha256
      - name: Canonical registry manifest writer and exact tracked identity
        working-directory: owned-game-engine
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p labwired-cli --bin gen-peripherals-manifest -- --out ../game-evidence/peripherals-manifest.json
          cmp ../game-evidence/peripherals-manifest.json crates/core/tests/fixtures/peripherals/manifest.json
      - name: Measure the new conformance row with the canonical writer
        working-directory: owned-game-engine
        run: |
          set -euo pipefail
          git show HEAD:docs/coverage/chip-conformance.json > ../game-evidence/conformance-before.json
          UPDATE_CONFORMANCE_BASELINE=1 cargo test --release --locked -p labwired-core --test chip_conformance -- --exact chip_conformance_ratchet --nocapture > ../game-evidence/conformance-writer.log 2>&1
          cp docs/coverage/chip-conformance.json ../game-evidence/conformance-after.json
          cp docs/coverage/chip-conformance.md ../game-evidence/conformance-after.md
          # Only generated documentation changes; restore these owned CI files
          # before the actual engine/guest builds. Never change a gate here.
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' docs/coverage/chip-conformance.json docs/coverage/chip-conformance.md | sort)"
          git restore --source=HEAD -- docs/coverage/chip-conformance.json docs/coverage/chip-conformance.md
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Three fresh actual native game samples
        working-directory: owned-game-engine
        env:
          BW_GAME_PACKAGE: ${{ github.workspace }}/game-evidence/package
          BW_GAME_ENGINE: ${{ env.ENGINE }}
        run: |
          set -euo pipefail
          cargo test --release --locked -p labwired-core --features event-scheduler,jit-framework --test bw_game -- --ignored --exact native_game --nocapture > ../game-evidence/native.log 2>&1
          tail -n 20 ../game-evidence/native.log
      - name: Build exact WASM and matching bindgen glue
        working-directory: owned-game-engine
        run: |
          set -euo pipefail
          cargo build --release --locked --target wasm32-unknown-unknown -p labwired-wasm
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install --locked wasm-bindgen-cli --version "$version" --root ../game-tools
          ../game-tools/bin/wasm-bindgen target/wasm32-unknown-unknown/release/labwired_wasm.wasm --target nodejs --out-dir ../game-evidence/wasm-node
          ../game-tools/bin/wasm-bindgen target/wasm32-unknown-unknown/release/labwired_wasm.wasm --target web --out-dir ../game-evidence/wasm-web
          echo '{"type":"commonjs"}' > ../game-evidence/wasm-node/package.json
          sha256sum ../game-evidence/wasm-node/* ../game-evidence/wasm-web/* > ../game-evidence/wasm-sha256.txt
      - name: Three fresh actual WASM game samples
        run: |
          set -euo pipefail
          node samd-game/wasm.mjs game-evidence/package owned-game-engine game-evidence/wasm-node/labwired_wasm.js "$ENGINE" > game-evidence/wasm.log 2>&1
          tail -n 20 game-evidence/wasm.log
      - name: Preserve all source-bound originals once
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: samd-active-game
          path: |
            game-evidence/**
            fb-inputs/request.json
            fb-inputs/device/generator.json
            !game-evidence/base/obj/**
            !game-evidence/base/request/**
          retention-days: 14
          if-no-files-found: warn
