name: Include-adapted PXT SAMD51 flash compile-only
on:
  pull_request:
    paths:
      - 'pxt-storage-compile/**'
      - 'tools/pxt-storage/sources.py'
      - 'profiles/pxt-framework-sources.json'
      - 'consumer-build/build.py'
      - 'runtime-services/platform_includes.h'
      - 'runtime-services/reviewed-toolchain/**'
      - '.github/workflows/pxt-flash-compile.yml'
permissions:
  contents: read
jobs:
  pxt-flash-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-flash-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt-common-packages
          ref: 31abf23d118f35010fb75122e60a1eb2b6dffe9f
          path: owned-flash-framework
          sparse-checkout: libs
          persist-credentials: false
      - name: Adaptation, dependency-origin and hosted-entry controls (no compiler)
        run: python3 -B -m unittest discover -s pxt-storage-compile -p 'test_*.py' -v
      - name: Install hosted ARM compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Compile real include-adapted driver and require specific refusal controls
        run: python3 -B pxt-storage-compile/compile_flash.py owned-flash-core owned-flash-framework flash-compile-evidence
      - name: Preserve original/adapted source, dependencies, diagnostics and notices
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxt-flash-compile-evidence
          path: |
            flash-compile-evidence/**
            !flash-compile-evidence/**/*.o
          if-no-files-found: warn
          retention-days: 14
