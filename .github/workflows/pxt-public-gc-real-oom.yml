name: Real PXT public GC fatal OOM
on:
  pull_request:
    paths:
      - 'pxt-gc-runtime/**'
      - 'pxt-native-allocation/**'
      - 'runtime-services/**'
      - 'tools/pxt-storage/**'
      - 'profiles/pxt-framework-sources.json'
      - '.github/workflows/pxt-public-gc-real-oom.yml'
permissions:
  contents: read
jobs:
  pxt-public-gc-real-oom:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-gc-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt-common-packages
          ref: 31abf23d118f35010fb75122e60a1eb2b6dffe9f
          path: owned-gc-framework
          sparse-checkout: libs
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/pxt
          ref: c40f412dc5bebb915a5891cd62fe956e198fb194
          path: owned-gc-generator
          sparse-checkout: pxtlib
          persist-credentials: false
      - name: Pure adaptation and expected-fatal controls (not guest qualification)
        run: |
          python3 -B -m unittest discover -s pxt-gc-runtime -p 'test_*.py' -v
          python3 -B -m unittest discover -s pxt-native-allocation -p 'test_*.py' -v
      - name: Install hosted compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Link separate expected-fatal public GC caller
        run: python3 -B pxt-gc-runtime/build_gc.py owned-gc-core owned-gc-framework owned-gc-generator gc-link-evidence --case public-gc-real-oom
      - name: Selected memset host boundary controls (not ARM qualification)
        run: |
          set -o pipefail
          python3 -B pxt-gc-runtime/check_memset.py | tee gc-link-evidence/memset-boundaries.log
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CrispStrobe/labwired-core
          ref: 73f8475f8e406b1ff4475bc9886e22479881d67a
          path: owned-gc-engine
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owned-gc-engine
      - name: Bind owned fixture without modifying engine product sources or lock
        run: |
          test "$(git -C owned-gc-engine rev-parse HEAD)" = 73f8475f8e406b1ff4475bc9886e22479881d67a
          test -z "$(git -C owned-gc-engine status --porcelain --untracked-files=no)"
          test ! -e owned-gc-engine/crates/core/tests/bw_pxt_public_oom_consumer.rs
          install -m 0644 pxt-gc-runtime/guest-public-oom.rs owned-gc-engine/crates/core/tests/bw_pxt_public_oom_consumer.rs
          cmp pxt-gc-runtime/guest-public-oom.rs owned-gc-engine/crates/core/tests/bw_pxt_public_oom_consumer.rs
          sha256sum pxt-gc-runtime/guest-public-oom.rs > gc-link-evidence/guest-fixture-sha256.txt
          git rev-parse HEAD > gc-link-evidence/guest-runtime-source.txt
          git -C owned-gc-engine rev-parse HEAD > gc-link-evidence/guest-engine-source.txt
      - name: Execute actual expected-fatal caller in both scheduler profiles
        env:
          BW_GC_ENGINE_SOURCE: 73f8475f8e406b1ff4475bc9886e22479881d67a
        run: |
          set -o pipefail
          export BW_GC_PUBLIC_OOM_DIR="$GITHUB_WORKSPACE/gc-link-evidence"
          BW_GC_RUNTIME_SOURCE="$(git rev-parse HEAD)"
          export BW_GC_RUNTIME_SOURCE
          cd owned-gc-engine
          cargo test --release --locked -p labwired-core --test bw_pxt_public_oom_consumer -- --nocapture 2>&1 | tee ../gc-link-evidence/guest-controls.log
          cargo test --release --locked -p labwired-core --test bw_pxt_public_oom_consumer -- --ignored --nocapture 2>&1 | tee ../gc-link-evidence/guest-default.log
          cargo test --release --locked -p labwired-core --features event-scheduler --test bw_pxt_public_oom_consumer -- --ignored --nocapture 2>&1 | tee ../gc-link-evidence/guest-event-scheduler.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Actual permanent-ownership and GC-fatal-policy mutants in both profiles
        run: |
          set -o pipefail
          python3 -B pxt-gc-runtime/check_public_oom_mutants.py | tee gc-public-oom-mutants-summary.log
      - name: Preserve actual source-bound caller evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxt-public-gc-oom-positive-evidence
          path: |
            gc-link-evidence/**
            !gc-link-evidence/**/*.o
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve isolated source mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxt-public-gc-oom-mutation-evidence
          path: |
            gc-public-oom-mutants/**
            !gc-public-oom-mutants/**/*.o
            gc-public-oom-mutants-summary.log
          if-no-files-found: warn
          retention-days: 14
