name: No-ASF full-board base closure
on:
  pull_request:
    paths:
      - 'no-asf-board/fullboard/**'
      - 'no-asf-board/support/**'
      - 'no-asf-board/native/**'
      - 'no-asf-board/tcc-leaf/**'
      - 'no-asf-board/cf2/**'
      - 'profiles/pxt-cf2-authored-metadata.json'
      - 'tools/samd51-device-header/**'
      - 'tools/pxt-native-request/**'
      - 'tools/generated-board-profile/**'
      - 'profiles/pxt-generated-board-profile.json'
      - 'profiles/pxt-framework-sources.json'
      - 'profiles/pxt-framework-sources-serial.json'
      - 'src/**'
      - 'inc/**'
      - 'asm/CortexContextSwitch.s'
      - '.github/workflows/pxt-no-asf-fullboard.yml'
permissions:
  contents: read
jobs:
  fullboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ENGINE: dd2e42a8f5a0be88e95dbc09f25c79d61d357f02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-fb-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal
          ref: 7cf09a3a37c8aca6e100b7265c81e6cdf6129dd2
          path: owned-fb-generator
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-itsybitsy-m4
          ref: 6ecd80ccf1abcc126d06653f178ca03a4d1c6421
          path: owned-fb-board
          persist-credentials: false
      - name: Install hosted ARM compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Admitted Arcade 4.2.1 target and PXT 13.2.1 worker payloads
        run: |
          set -euo pipefail
          mkdir -p fb-inputs/npm
          cd fb-inputs/npm
          curl -sSfL -o arcade.tgz https://registry.npmjs.org/pxt-arcade/-/pxt-arcade-4.2.1.tgz
          curl -sSfL -o core.tgz https://registry.npmjs.org/pxt-core/-/pxt-core-13.2.1.tgz
          tar xzf arcade.tgz package/built/target.json
          mv package/built/target.json target.json
          tar xzf core.tgz package/built/web/pxtworker.js
          mv package/built/web/pxtworker.js pxtworker.js
          echo "6f35aadf1456436b3318d2f2339cc3d1add6e6c3b0bf8566f86d7f7bb4f7722e  target.json" | sha256sum -c
          echo "1d9e73fd4bc0c0939b938395537ff1934b398654f9026f88e9293c32ea5acb0e  pxtworker.js" | sha256sum -c
          sha256sum arcade.tgz core.tgz
      - name: Reproduce the admitted native build requests offline
        run: |
          set -euo pipefail
          node tools/pxt-native-request/request.mjs fb-inputs/npm/target.json fb-inputs/npm/pxtworker.js samd51adafruit fb-inputs/request.json
          echo "19efcdc73769fdfdeb51aa215c528bebad59782cbc538f72f4a194326f1f42b1  fb-inputs/request.json" | sha256sum -c
          node tools/pxt-native-request/request.mjs fb-inputs/npm/target.json fb-inputs/npm/pxtworker.js samd51adafruit fb-inputs/request-serial.json no-asf-board/native/programs/uart.ts
          echo "46f71f70a05d56d9c86c813c8d949fbc30521e2fa8cf948a3790866fe1bf3213  fb-inputs/request-serial.json" | sha256sum -c
      - name: Generate device headers from the Apache-2.0 ATDF
        run: |
          set -euo pipefail
          mkdir -p fb-inputs/dfp
          curl -sSfL -o fb-inputs/dfp/pack.atpack https://packs.download.microchip.com/Microchip.SAMD51_DFP.3.9.276.atpack
          echo "6f4e530bb8ce3d7a86b7bfafb072110f1e6eb4aa53e554c71f3db6a9720c039f  fb-inputs/dfp/pack.atpack" | sha256sum -c
          unzip -q -o fb-inputs/dfp/pack.atpack LICENSE.txt samd51a/atdf/ATSAMD51J19A.atdf -d fb-inputs/dfp
          cmp fb-inputs/dfp/LICENSE.txt tools/samd51-device-header/notices/microchip-samd51-dfp-3.9.276-LICENSE.txt
          python3 -B tools/samd51-device-header/generate.py fb-inputs/dfp/samd51a/atdf/ATSAMD51J19A.atdf fb-inputs/device
          python3 -B tools/samd51-device-header/test_generate.py fb-inputs/dfp/samd51a/atdf/ATSAMD51J19A.atdf fb-inputs/device
      - name: Compile and link the complete board base with full dependency admission
        run: python3 -B no-asf-board/fullboard/build.py --core owned-fb-core --generator owned-fb-generator --board owned-fb-board --request fb-inputs/request.json --device fb-inputs/device --out fb-evidence
      - name: Compile and link the serial-request base
        run: python3 -B no-asf-board/fullboard/build.py --variant serial --core owned-fb-core --generator owned-fb-generator --board owned-fb-board --request fb-inputs/request-serial.json --device fb-inputs/device --out fb-evidence-serial
      - name: Compile and link the TCC timer leaf (no MakeCode runtime)
        run: python3 -B no-asf-board/fullboard/build.py --variant tcc-leaf --core owned-fb-core --generator owned-fb-generator --board owned-fb-board --device fb-inputs/device --out fb-evidence-tcc
      - name: Native Arcade programs onto the owned bases
        run: |
          set -euo pipefail
          printf '' > fb-inputs/main.ts
          compile() { node tools/pxt-native-request/compile.mjs fb-inputs/npm/target.json fb-inputs/npm/pxtworker.js samd51adafruit "$1" "$2" "$3"; }
          compile fb-evidence/no-asf-board.hex fb-inputs/main.ts fb-evidence/program
          for p in pins i2c pwm audio frame input hf2 spi adc; do
            compile fb-evidence/no-asf-board.hex no-asf-board/native/programs/$p.ts fb-evidence/program-$p
          done
          compile fb-evidence-serial/no-asf-board.hex no-asf-board/native/programs/uart.ts fb-evidence/program-uart
      - name: Assemble the native images with the authored boot region
        run: |
          set -euo pipefail
          mkdir fb-evidence/native
          python3 -B no-asf-board/native/boot.py fb-evidence/program/binary.uf2 fb-evidence/native/image.bin
          for p in pins i2c pwm audio uart frame input hf2 spi adc; do
            python3 -B no-asf-board/native/boot.py fb-evidence/program-$p/binary.uf2 fb-evidence/native/image-$p.bin
          done
          python3 -B no-asf-board/tcc-leaf/image.py fb-evidence-tcc/no-asf-board.bin fb-evidence/native/image-tcc-leaf.bin
          cp fb-evidence/no-asf-board.elf fb-evidence/native/no-asf-board.elf
          cp fb-evidence-serial/no-asf-board.elf fb-evidence/native/no-asf-board-serial.elf
          cp fb-evidence-tcc/no-asf-board.elf fb-evidence/native/no-asf-board-tcc.elf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CrispStrobe/labwired-core
          ref: ${{ env.ENGINE }}
          path: owned-native-engine
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: owned-native-engine
          cache-on-failure: true
          cache-all-crates: true
          key: samd51-native-board
      - name: Bind engine and consumer fixture
        run: |
          test "$(git -C owned-native-engine rev-parse HEAD)" = "$ENGINE"
          test -z "$(git -C owned-native-engine status --porcelain --untracked-files=no)"
          test ! -e owned-native-engine/crates/core/tests/bw_native.rs
          install -m 0644 no-asf-board/native/guest.rs owned-native-engine/crates/core/tests/bw_native.rs
          install -m 0644 no-asf-board/native/peripherals.yaml owned-native-engine/crates/core/tests/bw_native_peripherals.yaml
          sha256sum no-asf-board/native/guest.rs no-asf-board/native/peripherals.yaml > fb-evidence/native/consumer-fixture-sha256.txt
      - name: Native boot, USB, HF2 and peripheral cases with controls in both profiles
        working-directory: owned-native-engine
        env:
          BW_NATIVE_FIXTURE_DIR: ${{ github.workspace }}/fb-evidence/native
        run: |
          set -euo pipefail
          export BW_NATIVE_ENGINE_SOURCE="$ENGINE"
          logs=../fb-evidence/native/logs
          mkdir "$logs"
          cases="positive no-info-pointer erased-reset-forward
            pins pins-no-jumper pins-no-mux pins-eic-unclocked pins-irq-masked
            i2c i2c-no-device i2c-unclocked i2c-unrouted
            display display-wrong-cs display-mosi-unrouted
            pwm pwm-unrouted pwm-stopped
            uart uart-no-rx uart-dre-masked uart-tx-unrouted uart-rx-unrouted
            audio audio-tc3-stopped audio-dma-irq-masked
            frame input input-none input-no-load
            tcc-leaf tcc-leaf-mc-masked
            hf2
            spi spi-no-device spi-miso-unrouted
            adc adc-zero adc-unclocked"
          for profile in default event-scheduler; do
            flags=()
            if [ "$profile" != default ]; then flags+=(--features "$profile"); fi
            # Build once, then run the cases in parallel on the one binary.
            bin=$(cargo test --release --locked -p labwired-core --test bw_native "${flags[@]}" --no-run --message-format=json \
              | jq -r 'select(.executable != null and .target.name == "bw_native") | .executable')
            test -x "$bin"
            printf '%s\n' $cases | xargs -P 4 -I{} sh -c \
              'BW_NATIVE_CASE={} "$0" --ignored --exact native_program_boot_usb_hf2 --nocapture > "$1/$2-{}.log" 2>&1' "$bin" "$logs" "$profile" || true
            for case_name in $cases; do
              if ! grep -q "^test result: ok. 1 passed" "$logs/$profile-$case_name.log"; then
                echo "FAILED $profile $case_name"; tail -n 30 "$logs/$profile-$case_name.log"; exit 1
              fi
              grep -h "^NATIVE_\(FINITE_PASS\|NEGATIVE\)" "$logs/$profile-$case_name.log"
            done
          done
      - name: Preserve source-bound originals once
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: no-asf-fullboard-base
          path: |
            fb-evidence/**
            fb-inputs/request.json
            fb-inputs/request-serial.json
            fb-evidence-serial/build-report.json
            fb-evidence-tcc/build-report.json
            fb-inputs/device/**
            !fb-evidence/obj/**
            !fb-evidence/request/**
          if-no-files-found: warn
          retention-days: 14
