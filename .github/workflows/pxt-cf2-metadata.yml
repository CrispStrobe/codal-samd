name: Authored CF2 metadata source controls
on:
  pull_request:
    paths:
      - 'no-asf-board/cf2/**'
      - 'profiles/pxt-cf2-authored-metadata.json'
      - '.github/workflows/pxt-cf2-metadata.yml'
permissions:
  contents: read
jobs:
  source-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: adafruit/uf2-samdx1
          ref: d4dc92889759c0c551683420e24c5ef535ac303e
          path: owned-cf2-source
          persist-credentials: false
      - name: Admit only numeric configuration and retained original notice
        run: python3 -B no-asf-board/cf2/metadata.py owned-cf2-source/boards/arcade_pybadge/board_config.h owned-cf2-source/LICENSE
      - name: Source identity and independent byte-layout refusal controls
        run: python3 -B no-asf-board/cf2/test_metadata.py owned-cf2-source/boards/arcade_pybadge/board_config.h owned-cf2-source/LICENSE
